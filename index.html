<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منچ آنلاین</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bs:min(calc(100vw - 12px),72vh,720px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:Vazirmatn,tahoma,sans-serif;color:#e2e8f0;text-align:center;padding:8px;
background:radial-gradient(900px 500px at 50% -10%,#1d4ed855,transparent),#0b1220;display:flex;flex-direction:column;align-items:center}
h1{margin:6px 0;font-size:22px;font-weight:700;letter-spacing:.5px}
.card{background:#ffffff12;border:1px solid #ffffff22;border-radius:18px;padding:24px;margin-top:40px;width:min(92vw,360px)}
input{width:100%;font:inherit;font-size:16px;padding:12px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#fff;text-align:center}
.btn{font:inherit;font-weight:700;font-size:16px;border:0;border-radius:10px;padding:12px 20px;color:#fff;background:#2563eb;cursor:pointer;width:100%}
.btn:active{background:#1d4ed8}
.pl{display:flex;gap:6px;width:var(--bs);margin:4px 0}
.pn{flex:1;min-width:0;padding:6px 4px;border-radius:12px;background:#ffffff10;border:2px solid transparent;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:.25s}
.pn small{display:block;font-weight:400;opacity:.8;font-size:11px}
.pn.on{background:#ffffff26;box-shadow:0 0 14px var(--c)}
#board{position:relative;width:var(--bs);aspect-ratio:1;border-radius:20px;background:#f1f5f9;box-shadow:0 16px 40px #000a;overflow:hidden;direction:ltr}
#board>*{position:absolute}
.q{border-radius:16%}
.pad{background:#fff;border-radius:14%;box-shadow:inset 0 2px 6px #0004}
.slot{border-radius:50%;box-shadow:inset 0 3px 6px #0006}
.cell{border-radius:50%;background:#fff;box-shadow:inset 0 -2px 0 #0002,0 1px 3px #0003}
.pc{transition:left .45s ease,top .45s ease;display:flex;align-items:center;justify-content:center;z-index:5}
.pc i{width:76%;height:76%;border-radius:50%;border:2px solid #fff;background:radial-gradient(circle at 35% 30%,#fffa,var(--c) 50%,#0007);box-shadow:0 3px 5px #0009}
.pc.go{cursor:pointer;z-index:9}
.pc.go i{animation:pu .55s infinite alternate}
@keyframes pu{to{transform:scale(1.28);box-shadow:0 0 0 4px #0f172a,0 0 14px 5px #fff}}
.st{margin:6px 0;font-weight:700;font-size:14px;min-height:22px;width:var(--bs)}
#dbtn{display:block;left:45.36%;top:45.36%;width:9.27%;height:9.27%;z-index:4;background:none;border:0;padding:0;cursor:pointer;border-radius:24%}
#dbtn::after{content:'';position:absolute;inset:-30%}
#dbtn:disabled{opacity:.6;cursor:default}
#dbtn.rdy{animation:gl 1s infinite alternate}
@keyframes gl{to{box-shadow:0 0 0 3px #2563eb,0 0 16px #2563eb}}
#die{position:absolute;inset:0;background:linear-gradient(145deg,#fff,#cbd5e1);border-radius:24%;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:13%;box-shadow:0 2px 0 #94a3b8,0 4px 8px #0008}
#die span{place-self:center;width:calc(var(--bs)/11*.19);height:calc(var(--bs)/11*.19);border-radius:50%}
#die span.d{background:#0f172a}
#die.rl{animation:rl .8s ease-in-out}
#dbtn.up{z-index:30;opacity:1!important}
@keyframes rl{0%{transform:scale(1)}25%{transform:rotate(130deg) scale(2.6)}55%{transform:rotate(260deg) scale(2.3)}80%{transform:rotate(340deg) scale(1.4)}100%{transform:rotate(360deg) scale(1)}}
#chat{width:var(--bs);margin:12px 0;background:#ffffff0d;border:1px solid #ffffff1a;border-radius:14px;padding:10px}
#msgs{height:130px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;text-align:right}
.m{max-width:80%;padding:6px 10px;border-radius:10px;word-break:break-word;font-size:14px;background:#334155}
.m.me{align-self:flex-start;background:#1d4ed8}
.m b{display:block;font-size:11px;opacity:.85}
.row{display:flex;gap:6px;margin-top:8px}
.row input{font-size:14px;padding:9px;text-align:right}
#sb{width:auto;padding:0 16px;font-size:14px;opacity:.4}
#sb.on{opacity:1}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#0f172af0;border:1px solid #334155;padding:10px 18px;border-radius:10px;font-size:14px;z-index:50;max-width:92vw}
#win{position:fixed;inset:0;background:#020617d0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;font-size:22px;font-weight:700;padding:20px}
#win .btn{width:200px}
@media(max-width:480px){h1{font-size:18px;margin:2px 0}#msgs{height:110px}}
</style></head><body>
<h1>منچ آنلاین</h1>

<div id="lobby" class="card" hidden>
  <p style="margin:0 0 14px;font-weight:700">ورود به بازی</p>
  <input id="nm" placeholder="نام خود را وارد کنید" maxlength="20" style="margin-bottom:14px">
  <button class="btn" onclick="start()">ورود</button>
</div>

<div id="game" hidden>
  <div class="pl" id="pl"></div>
  <div id="st0" class="st"></div>
  <div id="board"><button id="dbtn" onclick="roll()"><div id="die"></div></button></div>
  <div id="st1" class="st"></div>
  <div id="chat">
    <div id="msgs"></div>
    <div class="row">
      <input id="ci" placeholder="پیام خود را بنویسید" maxlength="200" oninput="upd()" onkeydown="if(event.key=='Enter')say()">
      <button id="sb" class="btn" onclick="say()" disabled>ارسال</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<div id="win" hidden><div id="wm"></div><button class="btn" onclick="ws.send(JSON.stringify({t:'reset'}))">بازی جدید</button></div>

<script>
const DENSE=[];
// مسیر منحنی: ۴۰ خانه با فاصله مساوی روی مسیر ضربدری با گوشه‌های گرد
const T=(()=>{
  const V=[[.5,4.5],[4.5,4.5],[4.5,.5],[6.5,.5],[6.5,4.5],[10.5,4.5],[10.5,6.5],[6.5,6.5],[6.5,10.5],[4.5,10.5],[4.5,6.5],[.5,6.5]], r=.9, n=V.length;
  const pts=[[.5,5.5]];
  for(let i=0;i<n;i++){
    const v=V[i], p=V[(i+n-1)%n], q=V[(i+1)%n];
    const vec=o=>{ const dx=o[0]-v[0], dy=o[1]-v[1], l=Math.hypot(dx,dy); return [dx/l*r,dy/l*r]; };
    const a=vec(p), b=vec(q), c=[v[0]+a[0]+b[0], v[1]+a[1]+b[1]];
    for(let j=0;j<=16;j++){ const t=j/16*Math.PI/2;
      pts.push([c[0]-b[0]*Math.cos(t)-a[0]*Math.sin(t), c[1]-b[1]*Math.cos(t)-a[1]*Math.sin(t)]); }
  }
  pts.push([.5,5.5]);
  const cum=[0]; for(let i=1;i<pts.length;i++) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  const L=cum[cum.length-1], out=[]; let j=1;
  for(let k=1;k<=40;k++){
    const s=L*k/40; while(j<pts.length-1&&cum[j]<s) j++;
    const f=(s-cum[j-1])/((cum[j]-cum[j-1])||1);
    out.push([pts[j-1][0]+(pts[j][0]-pts[j-1][0])*f-.5, pts[j-1][1]+(pts[j][1]-pts[j-1][1])*f-.5]);
  }
  DENSE.push(...pts); return out;
})();
// صندلی‌ها: ۰ چپ (قرمز)، ۱ بالا (سبز)، ۲ راست (زرد)، ۳ پایین (آبی)
const H=[[[1,5],[2,5],[3,5],[4,5]],[[5,1],[5,2],[5,3],[5,4]],[[9,5],[8,5],[7,5],[6,5]],[[5,9],[5,8],[5,7],[5,6]]];
const B=[[[1,1],[2,1],[1,2],[2,2]],[[8,1],[9,1],[8,2],[9,2]],[[8,8],[9,8],[8,9],[9,9]],[[1,8],[2,8],[1,9],[2,9]]];
const Q=[[0,0],[7,0],[7,7],[0,7]];
const COL=['#ef4444','#22c55e','#eab308','#3b82f6'], CN=['قرمز','سبز','زرد','آبی'];
const PAT={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const u=100/11, $=id=>document.getElementById(id);
let ws,me,S,PC=[],built=false,myId,myName,rolling=false,face=1,prevDice=0;
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const ab=(p,s)=>(p*10+s)%40;
const pos=(p,i,s)=>s<0?B[p][i]:s<40?T[ab(p,s)]:H[p][s-40];
function canMove(p,i,d){
  const s=S.pcs[p*4+i]; let t;
  if(s<0){ if(d!=6) return null; t=0; } else { t=s+d; if(t>43) return null; }
  for(let j=0;j<4;j++) if(j!=i&&S.pcs[p*4+j]==t) return null;
  if(t<40) for(let q=0;q<4;q++) if(q!=p) for(let j=0;j<4;j++) if(S.pcs[q*4+j]==0&&ab(q,0)==ab(p,t)) return null;
  return t;
}
function mk(cls,x,y,w=1,h=1){
  const e=document.createElement('div'); e.className=cls;
  e.style.cssText=`left:${x*u}%;top:${y*u}%;width:${w*u}%;height:${h*u}%`;
  $('board').append(e); return e;
}
function cell(x,y,bg,m=.04){ const e=mk('cell',x+m,y+m,1-2*m,1-2*m); e.style.background=bg; return e; }
function build(){
  Q.forEach(([x,y],p)=>{
    mk('q',x,y,4,4).style.background=COL[p];
    mk('pad',x+.5,y+.5,3,3);
    B[p].forEach(([a,b])=>{ mk('slot',a+.12,b+.12,.76,.76).style.background=COL[p]; });
  });
  const NS='http://www.w3.org/2000/svg', sv=document.createElementNS(NS,'svg'), pa=document.createElementNS(NS,'path');
  sv.setAttribute('viewBox','0 0 11 11'); sv.style.cssText='left:0;top:0;width:100%;height:100%;pointer-events:none';
  pa.setAttribute('d','M'+DENSE.map(p=>p.join(',')).join('L')+'Z');
  pa.setAttribute('fill','none'); pa.setAttribute('stroke','#cbd5e1'); pa.setAttribute('stroke-opacity','.6');
  pa.setAttribute('stroke-width','.95'); pa.setAttribute('stroke-linejoin','round');
  sv.append(pa); $('board').append(sv);
  T.forEach(([x,y],k)=>cell(x,y,k%10==0?COL[k/10]:'#fff',.1));
  H.forEach((h,p)=>h.forEach(([x,y])=>cell(x,y,COL[p],.1)));
  for(let k=0;k<16;k++){
    const e=mk('pc',0,0), i=document.createElement('i'); e.style.setProperty('--c',COL[k>>2]); e.append(i);
    e.onclick=()=>pick(k); PC.push(e);
  }
  for(let p=0;p<4;p++){ const d=document.createElement('div'); d.className='pn'; d.id='p'+p; d.style.setProperty('--c',COL[p]); $('pl').append(d); }
  $('die').innerHTML='<span></span>'.repeat(9); showDie(1);
  built=true;
}
function showDie(n){ [...$('die').children].forEach((s,i)=>s.className=PAT[n].includes(i)?'d':''); }
function setFace(n){ face=n; if(!rolling) showDie(n); }
function animateRoll(){
  if(rolling) return; rolling=true;
  const d=$('die'), b=$('dbtn'); d.classList.add('rl'); b.classList.add('up');
  const iv=setInterval(()=>showDie(1+Math.floor(Math.random()*6)),90);
  setTimeout(()=>{ clearInterval(iv); rolling=false; d.classList.remove('rl'); b.classList.remove('up'); showDie(face); },800);
}
function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; setTimeout(()=>e.hidden=true,2600); }
function pick(k){
  const p=k>>2,i=k&3;
  if(p==me&&S.turn==me&&S.dice&&canMove(p,i,S.dice)!=null) ws.send(JSON.stringify({t:'move',i}));
}
function roll(){ animateRoll(); ws.send(JSON.stringify({t:'roll'})); }
function upd(){ const ok=!!$('ci').value.trim(); $('sb').disabled=!ok; $('sb').classList.toggle('on',ok); }
function say(){
  const v=$('ci').value.trim(); if(!v) return;
  ws.send(JSON.stringify({t:'chat',text:v})); $('ci').value=''; upd();
}
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',id:myId,name:myName,w:+ls.get('w')||0,l:+ls.get('l')||0}));
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.err){ ws.onclose=null; alert(m.err); return; }
    me=m.me; S=m.S; ls.set('w',S.stats[me][0]); ls.set('l',S.stats[me][1]);
    if(!built){ $('lobby').hidden=true; $('game').hidden=false; build(); }
    if(m.note){ toast(m.note); if(m.die){ setFace(m.die); if(m.by!=me) animateRoll(); } }
    draw(); chat(m.chat);
  };
  ws.onclose=()=>{ if(built) $('st1').textContent='ارتباط با سرور قطع شد؛ در حال اتصال مجدد...'; setTimeout(connect,2000); };
}
function start(){ const n=$('nm').value.trim(); if(!n) return; ls.set('name',n); myName=n; connect(); }
function chat(list){
  const box=$('msgs'), atEnd=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
  box.innerHTML='';
  list.forEach(c=>{
    const d=document.createElement('div'), b=document.createElement('b');
    d.className='m'+(c.f==me?' me':''); b.textContent=c.n; b.style.color=c.f==me?'#bfdbfe':COL[c.f];
    d.append(b,document.createTextNode(c.text)); box.append(d);
  });
  if(atEnd) box.scrollTop=box.scrollHeight;
}
function draw(){
  S.pcs.forEach((s,k)=>{
    const p=k>>2,i=k&3,[x,y]=pos(p,i,s),e=PC[k];
    e.style.left=x*u+'%'; e.style.top=y*u+'%';
    e.classList.toggle('go',!!(S.turn==me&&p==me&&S.dice&&S.win<0&&canMove(p,i,S.dice)!=null));
  });
  for(let p=0;p<4;p++){
    const el=$('p'+p), sm=document.createElement('small');
    el.textContent=S.names[p]+(me==p?' (شما)':''); el.style.borderColor=COL[p]+(S.turn==p&&S.win<0?'':'44');
    sm.textContent=S.bots[p]?'ربات':'برد '+S.stats[p][0]+' · باخت '+S.stats[p][1]; el.append(sm);
    el.classList.toggle('on',S.turn==p&&S.win<0);
  }
  if(S.dice){ if(!prevDice&&S.turn!=me) animateRoll(); setFace(S.dice); }
  prevDice=S.dice;
  const mine=S.turn==me&&!S.dice&&S.win<0;
  $('dbtn').disabled=!mine; $('dbtn').classList.toggle('rdy',mine);
  const who=S.names[S.turn];
  $('st0').textContent = S.win<0&&S.turn!=me ? (S.dice ? who+' عدد '+S.dice+' را آورد.' : 'نوبت «'+who+'» است.') : '';
  $('st1').textContent = S.win<0&&S.turn==me ? (S.dice ? 'عدد '+S.dice+' آمد؛ یک مهره را انتخاب کنید.' : 'نوبت شماست؛ تاس را بیندازید.') : 'رنگ شما: '+CN[me];
  $('win').hidden=S.win<0;
  if(S.win>=0) $('wm').textContent = S.win==me ? 'شما برنده بازی شدید.' : S.names[S.win]+' برنده بازی شد.';
}
setInterval(()=>{ if(ws&&ws.readyState==1) ws.send('{"t":"ping"}'); },25000);
myId=ls.get('id')||(ls.set('id',myId=Math.random().toString(36).slice(2)+Date.now().toString(36)),myId);
myName=ls.get('name');
if(myName) connect(); else $('lobby').hidden=false;
</script></body></html>
