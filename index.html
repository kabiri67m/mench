<!DOCTYPE html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>منچ ما دو نفر 💕</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800&display=swap" rel="stylesheet">
<style>
:root{--bs:min(calc(100vw - 12px),72vh,720px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;min-height:100vh;font-family:Vazirmatn,tahoma,sans-serif;color:#fff;text-align:center;
background:radial-gradient(circle at 50% 0,#be185d,#581c87 50%,#1e1b4b);display:flex;flex-direction:column;align-items:center;padding:6px}
#hs{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:-1}
#hs span{position:absolute;bottom:-40px;color:#fb7185;opacity:.25;animation:fl linear infinite}
@keyframes fl{to{transform:translateY(-110vh) rotate(25deg)}}
h1{margin:8px 0;font-size:26px;text-shadow:0 2px 14px #f472b6}
.card{background:rgba(255,255,255,.12);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);border-radius:22px;padding:24px;margin-top:40px;width:min(92vw,360px)}
.card p{opacity:.85;margin:6px 0 0}
input{width:100%;font:inherit;font-size:18px;padding:12px;border-radius:14px;border:0;text-align:center}
.btn{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:12px 20px;color:#500724;background:linear-gradient(#fda4af,#fb7185);box-shadow:0 5px 0 #be123c;cursor:pointer;width:100%}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #be123c}
.pl{display:flex;gap:8px;width:var(--bs);margin:4px 0}
.pn{flex:1;padding:8px;border-radius:14px;background:rgba(255,255,255,.08);border:2px solid transparent;font-weight:800;transition:.3s}
.pn.on{border-color:#fda4af;background:rgba(253,164,175,.25);box-shadow:0 0 18px #fb7185aa}
#board{position:relative;width:var(--bs);aspect-ratio:1;border-radius:22px;background:linear-gradient(135deg,#ffe4ec,#ede9fe);box-shadow:0 14px 40px #000a;overflow:hidden;direction:ltr}
#board>*{position:absolute}
.pad{background:#fff;border-radius:14%;box-shadow:inset 0 2px 6px #0005}
.slot{border-radius:50%;box-shadow:inset 0 3px 6px #0007}
.q{border-radius:16%}
.ph{border-radius:50%;overflow:hidden;background:#fff;border:3px solid #fff;box-shadow:0 4px 10px #0006;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/11*1.5);color:#f43f5e}
.ph img{width:100%;height:100%;object-fit:cover}
.cap{color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;white-space:nowrap;font-size:calc(var(--bs)/11*.38)}
.cell{border-radius:50%;box-shadow:inset 0 -3px 0 #0002,0 2px 4px #0003;display:flex;align-items:center;justify-content:center;color:#be185d;font-weight:800;font-size:calc(var(--bs)/11*.36)}
.cell.w{color:#fff}
.dim{opacity:.35}
.ctr{background:conic-gradient(from -45deg,#fbbf24 0 25%,#8b5cf6 0 50%,#f9a8d4 0 75%,#f43f5e 0);border-radius:20%;box-shadow:0 0 0 2px #fff;color:#fff;display:flex;align-items:center;justify-content:center;font-size:calc(var(--bs)/11*.4)}
.pc{transition:left .45s ease,top .45s ease;display:flex;align-items:center;justify-content:center;z-index:5}
.pc i{width:76%;height:76%;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-style:normal;color:#fff;font-size:calc(var(--bs)/11*.32);box-shadow:0 4px 6px #0009,inset 0 -5px 7px #0006,inset 0 3px 4px #fffa}
.pc.r i{background:radial-gradient(circle at 35% 30%,#fecdd3,#e11d48 55%,#881337)}
.pc.b i{background:radial-gradient(circle at 35% 30%,#ddd6fe,#7c3aed 55%,#4c1d95)}
.pc.go{cursor:pointer;z-index:9}
.pc.go i{animation:pu .55s infinite alternate}
@keyframes pu{to{transform:scale(1.28);box-shadow:0 0 0 4px #fde047,0 0 16px 6px #fde047}}
#st{margin:10px 0 4px;font-weight:800;min-height:28px}
#dbtn{background:none;border:0;padding:6px;cursor:pointer;border-radius:22px}
#dbtn:disabled{opacity:.55;cursor:default}
#dbtn.rdy{animation:gl 1s infinite alternate}
@keyframes gl{to{box-shadow:0 0 0 5px #fda4af88,0 0 24px #fb7185}}
#die{width:76px;height:76px;background:linear-gradient(145deg,#fff,#d1d5db);border-radius:18px;display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);padding:11px;box-shadow:0 6px 0 #9ca3af,0 10px 18px #0007}
#die span{place-self:center;width:15px;height:15px;border-radius:50%}
#die span.d{background:radial-gradient(circle at 35% 30%,#fb7185,#9f1239)}
#die.rl{animation:rl .6s}
@keyframes rl{20%{transform:rotate(120deg) scale(1.2)}50%{transform:rotate(250deg) scale(.9)}80%{transform:rotate(340deg) scale(1.1)}}
#chat{width:var(--bs);margin:14px 0;background:rgba(0,0,0,.25);border-radius:18px;padding:10px}
#msgs{height:160px;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px;text-align:right}
.m{max-width:78%;padding:6px 12px;border-radius:14px;word-break:break-word;font-size:15px}
.m.me{align-self:flex-start;background:#e11d48;border-bottom-right-radius:4px}
.m.ot{align-self:flex-end;background:#6d28d9;border-bottom-left-radius:4px}
.row{display:flex;gap:6px;margin-top:8px}
.row input{font-size:15px;padding:9px}
#sb{opacity:.35;transition:.2s}
#sb.on{opacity:1;color:#500724;background:linear-gradient(#fda4af,#fb7185)!important;box-shadow:0 0 14px #fb7185}
.row button{font-size:20px;border:0;border-radius:12px;background:rgba(255,255,255,.18);padding:0 10px;cursor:pointer}
#toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#111c;padding:10px 20px;border-radius:30px;font-weight:800;z-index:50}
#win{position:fixed;inset:0;background:#000b;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;font-size:28px;font-weight:800;padding:20px}
#win .btn{width:220px}
@media(max-width:480px){h1{font-size:20px;margin:2px 0}#die{width:64px;height:64px;padding:9px}#die span{width:12px;height:12px}#msgs{height:130px}}
</style></head><body>
<div id="hs"></div>
<h1>💕 منچ ما دو نفر 💕</h1>

<div id="lobby" class="card" hidden>
  <b style="font-size:20px">سلام عشقم 🥰</b>
  <p>اسمت چیه؟</p>
  <input id="nm" placeholder="اسمت رو بنویس" maxlength="20" style="margin:14px 0">
  <button class="btn" onclick="start()">بزن بریم</button>
</div>

<div id="game" hidden>
  <div class="pl"><div id="p0" class="pn"></div><div id="p1" class="pn"></div></div>
  <div id="board"></div>
  <div id="st"></div>
  <button id="dbtn" onclick="roll()"><div id="die"></div></button>
  <div id="chat">
    <div id="msgs"></div>
    <div class="row">
      <input id="ci" placeholder="یه پیام قشنگ بنویس..." maxlength="200" oninput="upd()" onkeydown="if(event.key=='Enter')say()">
      <button id="sb" onclick="say()" disabled>➤</button>
      <button onclick="add('❤️')">❤️</button><button onclick="add('😘')">😘</button><button onclick="add('😂')">😂</button>
    </div>
  </div>
</div>
<div id="toast" hidden></div>
<div id="win" hidden><div id="wm"></div><button class="btn" onclick="ws.send(JSON.stringify({t:'reset'}))">بازی دوباره 💞</button></div>

<script>
const T=[[0,4],[1,4],[2,4],[3,4],[4,4],[4,3],[4,2],[4,1],[4,0],[5,0],[6,0],[6,1],[6,2],[6,3],[6,4],[7,4],[8,4],[9,4],[10,4],[10,5],
[10,6],[9,6],[8,6],[7,6],[6,6],[6,7],[6,8],[6,9],[6,10],[5,10],[4,10],[4,9],[4,8],[4,7],[4,6],[3,6],[2,6],[1,6],[0,6],[0,5]];
const H=[[[1,5],[2,5],[3,5],[4,5]],[[9,5],[8,5],[7,5],[6,5]]];
const B=[[[1,1],[2,1],[1,2],[2,2]],[[8,8],[9,8],[8,9],[9,9]]];
const u=100/11, $=id=>document.getElementById(id);
const C={r:'#f43f5e',b:'#8b5cf6',y:'#fbbf24',g:'#f9a8d4'};
const PAT={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
let ws,me,S,PC=[],CAP=[],built=false,myId,myName;
const ls={get:k=>{try{return localStorage.getItem(k)}catch{return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch{}}};
const ab=(p,s)=>(p*20+s)%40;
const pos=(p,i,s)=>s<0?B[p][i]:s<40?T[ab(p,s)]:H[p][s-40];
function canMove(p,i,d){
  const s=S.pcs[p*4+i]; let t;
  if(s<0){ if(d!=6) return null; t=0; } else { t=s+d; if(t>43) return null; }
  for(let j=0;j<4;j++) if(j!=i&&S.pcs[p*4+j]==t) return null;
  return t;
}
function mk(cls,x,y,w=1,h=1){
  const e=document.createElement('div'); e.className=cls;
  e.style.cssText=`left:${x*u}%;top:${y*u}%;width:${w*u}%;height:${h*u}%`;
  $('board').append(e); return e;
}
function cell(x,y,bg){ const e=mk('cell',x+.04,y+.04,.92,.92); e.style.background=bg; return e; }
function build(){
  [[0,0,'r',B[0]],[7,7,'b',B[1]]]
  .forEach(([x,y,c,sl])=>{
    const d='yg'.includes(c)?' dim':'';
    mk('q'+d,x,y,4,4).style.background=C[c];
    mk('pad'+d,x+.5,y+.5,3,3);
    sl.forEach(([a,b])=>{ mk('slot'+d,a+.12,b+.12,.76,.76).style.background=C[c]; });
  });
  [[7,0,0],[0,7,1]].forEach(([x,y,p])=>{
    mk('q',x,y,4,4).style.background=p?C.b:C.r;
    const d=mk('ph',x+.45,y+.25,3.1,3.1), im=new Image(), E=['jpg','jpeg','png','webp']; let n=0;
    im.onerror=()=>{ if(++n<E.length) im.src='photo'+(p+1)+'.'+E[n]; else { im.remove(); d.textContent='♥'; } };
    im.src='photo'+(p+1)+'.jpg'; d.append(im);
    CAP[p]=mk('cap',x,y+3.35,4,.6);
  });
  for(let k=1;k<=4;k++){ cell(5,k,C.g).classList.add('dim'); cell(5,10-k,C.g).classList.add('dim'); }
  T.forEach(([x,y],k)=>{ const e=cell(x,y,k==0?C.r:k==20?C.b:'#fff'); if(k==0||k==20){ e.textContent='♥'; e.classList.add('w'); } });
  H.forEach((h,p)=>h.forEach(([x,y],j)=>{ const e=cell(x,y,p?C.b:C.r); e.classList.add('w'); }));
  mk('ctr',5,5).textContent='♥';
  for(let k=0;k<8;k++){
    const e=mk('pc '+(k>>2?'b':'r'),0,0), i=document.createElement('i'); i.textContent='♥'; e.append(i);
    e.onclick=()=>pick(k); PC.push(e);
  }
  $('die').innerHTML='<span></span>'.repeat(9); showDie(1);
  built=true;
}
function showDie(n){ [...$('die').children].forEach((s,i)=>s.className=PAT[n].includes(i)?'d':''); }
function toast(t){ const e=$('toast'); e.textContent=t; e.hidden=false; setTimeout(()=>e.hidden=true,2200); }
function pick(k){
  const p=k>>2,i=k&3;
  if(p==me&&S.turn==me&&S.dice&&canMove(p,i,S.dice)!=null) ws.send(JSON.stringify({t:'move',i}));
}
function roll(){
  $('die').classList.add('rl'); setTimeout(()=>$('die').classList.remove('rl'),600);
  ws.send(JSON.stringify({t:'roll'}));
}
function upd(){ const ok=!!$('ci').value.trim(); $('sb').disabled=!ok; $('sb').classList.toggle('on',ok); }
function add(e){ $('ci').value+=e; upd(); }
function say(){
  const v=$('ci').value.trim(); if(!v) return;
  ws.send(JSON.stringify({t:'chat',text:v})); $('ci').value=''; upd();
}
function connect(){
  ws=new WebSocket((location.protocol=='https:'?'wss://':'ws://')+location.host);
  ws.onopen=()=>ws.send(JSON.stringify({t:'join',id:myId,name:myName}));
  ws.onmessage=e=>{
    const m=JSON.parse(e.data);
    if(m.err){ ws.onclose=null; alert(m.err); return; }
    me=m.me; S=m.S;
    if(!built){ $('lobby').hidden=true; $('game').hidden=false; build(); }
    if(m.note){ toast(m.note); const d=m.note.match(/\d/); if(d) showDie(+d[0]); }
    draw(); chat(m.chat);
  };
  ws.onclose=()=>{ if(built) $('st').textContent='🔌 اتصال قطع شد، دوباره وصل می‌شم...'; setTimeout(connect,2000); };
}
function start(){
  const n=$('nm').value.trim(); if(!n) return;
  ls.set('name',n); myName=n; connect();
}
function chat(list){
  const box=$('msgs'), atEnd=box.scrollTop+box.clientHeight>=box.scrollHeight-30;
  box.innerHTML='';
  list.forEach(c=>{
    const d=document.createElement('div'); d.className='m '+(c.f==me?'me':'ot'); d.textContent=c.text; box.append(d);
  });
  if(atEnd) box.scrollTop=box.scrollHeight;
}
function draw(){
  S.pcs.forEach((s,k)=>{
    const p=k>>2,i=k&3,[x,y]=pos(p,i,s),e=PC[k];
    e.style.left=x*u+'%'; e.style.top=y*u+'%';
    e.classList.toggle('go',!!(S.turn==me&&p==me&&S.dice&&S.win<0&&canMove(p,i,S.dice)!=null));
  });
  [0,1].forEach(p=>{
    CAP[p].textContent=S.names[p]||'';
    $('p'+p).textContent=(p?'💜 ':'❤️ ')+(S.names[p]||'منتظر...')+(me==p?' (تو)':'');
    $('p'+p).classList.toggle('on',S.n==2&&S.turn==p&&S.win<0);
  });
  if(S.dice) setTimeout(()=>showDie(S.dice),350);
  const mine=S.n==2&&S.turn==me&&!S.dice&&S.win<0;
  $('dbtn').disabled=!mine; $('dbtn').classList.toggle('rdy',mine);
  const other=S.names[1-me]||'عشقم';
  $('st').textContent = S.n<2 ? '💌 منتظر '+other+'...'
    : S.win>=0 ? '' : S.turn!=me ? 'نوبت '+other+'ـه...' : S.dice ? '👆 یه مهره انتخاب کن' : '🎲 نوبت توئه، تاس بنداز!';
  $('win').hidden=S.win<0;
  if(S.win>=0) $('wm').textContent='🏆 '+S.names[S.win]+' برد! 💖'+(S.win==me?'\nجایزه‌ات یه بغل محکمه 🤗':'');
}
for(let i=0;i<14;i++){
  const s=document.createElement('span'); s.textContent='♥';
  s.style.cssText=`left:${Math.random()*100}%;font-size:${14+Math.random()*30}px;animation-duration:${8+Math.random()*10}s;animation-delay:${-Math.random()*12}s`;
  $('hs').append(s);
}
myId=ls.get('id')||(ls.set('id',myId=Math.random().toString(36).slice(2)+Date.now().toString(36)),myId);
myName=ls.get('name');
if(myName) connect(); else $('lobby').hidden=false;
</script></body></html>
